name: Deploy to GCP Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: verdiqt-production # Hardcoded to your GCP Project ID
  REGION: asia-south1 # Update this if you chose a different region
  API_REPO_NAME: verdiqt-api
  WEB_REPO_NAME: verdiqt-web

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Needed for Turbo to detect changes

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: 'github-actions-deployer@verdiqt-production.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker Auth
        run: |-
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install pnpm & turbo
        run: npm i -g pnpm turbo

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # ==========================================
      # DEPLOY BACKEND (API)
      # ==========================================
      - name: Build and Push Backend Image
        run: |
          IMAGE_TAG=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.API_REPO_NAME }}/api:${{ github.sha }}
          docker build -f apps/api/Dockerfile -t $IMAGE_TAG .
          docker push $IMAGE_TAG
          echo "API_IMAGE=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy Backend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: verdiqt-api
          region: ${{ env.REGION }}
          image: ${{ env.API_IMAGE }}
          flags: >-
            --allow-unauthenticated
            --session-affinity
            --concurrency=80
            --cpu=1
            --memory=512Mi
            --port=4000
            --set-env-vars=NODE_ENV=production
            --set-env-vars=FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            --set-env-vars=DATABASE_URL=${{ secrets.DATABASE_URL }}
            --set-env-vars=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            --set-env-vars=ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            --set-env-vars=RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            --set-env-vars=FIREBASE_SERVICE_ACCOUNT_BASE64=${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
            --set-env-vars=CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            --set-env-vars=CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            --set-env-vars=CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}

      # ==========================================
      # DEPLOY FRONTEND (WEB)
      # ==========================================
      - name: Build and Push Frontend Image
        run: |
          IMAGE_TAG=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.WEB_REPO_NAME }}/web:${{ github.sha }}
          docker build \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}" \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" \
            --build-arg NEXT_PUBLIC_APP_URL="${{ secrets.NEXT_PUBLIC_APP_URL }}" \
            --build-arg NEXT_PUBLIC_API_URL="${{ secrets.NEXT_PUBLIC_API_URL }}" \
            -f apps/web/Dockerfile -t $IMAGE_TAG .
          docker push $IMAGE_TAG
          echo "WEB_IMAGE=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy Frontend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: verdiqt-web
          region: ${{ env.REGION }}
          image: ${{ env.WEB_IMAGE }}
          flags: >-
            --allow-unauthenticated
            --concurrency=80
            --cpu=1
            --memory=512Mi
            --port=3000
            --set-env-vars=NODE_ENV=production
            --set-env-vars=NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            --set-env-vars=NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            --set-env-vars=NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
